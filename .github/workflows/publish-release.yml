name: Publish verified release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out published commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify source and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q veeam_xfs_cleanup.py tests scripts
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build package and SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_release.py
          cd dist
          sha256sum -c "$(find . -maxdepth 1 -name 'veeam_xfs_cleanup_v*_SHA256SUMS.txt' -print -quit)"

      - name: Publish release and upload verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 veeam_xfs_cleanup.py --version)"
          tag="v${version#veeam-xfs-cleanup }"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo 'Tag does not match the script version' >&2
            exit 1
          fi
          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              dist/veeam_xfs_cleanup_v*_client_with_guide.zip \
              dist/Veeam_XFS_Backup_Copy_Cleanup_v*_Operator_Guide.pdf \
              dist/veeam_xfs_cleanup_v*_SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Veeam XFS Backup-Copy Cleanup ${tag}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi

      - name: Verify downloadable GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 veeam_xfs_cleanup.py --version)"
          tag="v${version#veeam-xfs-cleanup }"
          mkdir -p release-download
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --dir release-download
          for f in dist/*; do
            cmp "$f" "release-download/$(basename "$f")"
          done
          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json tagName,url,isDraft,isPrerelease
